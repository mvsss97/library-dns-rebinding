---
# Outils communs aux VM du TP.

- name: Update APT cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 600

- name: Install common tools (python3, venv, dig)
  ansible.builtin.apt:
    name:
      - python3
      - python3-venv
      - dnsutils
    state: present
    lock_timeout: 600

# Les deux serveurs du TP tournent dans un virtualenv dédié plutôt qu'avec le Python
# du système. Raison : sur certaines images, un Jinja2 récent installé par pip masque
# celui de la distribution et casse le Flask d'apt
#   (ImportError: cannot import name 'escape' from 'jinja2').
# Un virtualenv ignore /usr/lib et /usr/local/lib : on obtient toujours un Flask
# cohérent, quel que soit l'état du Python système de l'image.
- name: Create the lab virtualenv with Flask
  ansible.builtin.pip:
    name: flask
    state: present
    virtualenv: "{{ seed_venv }}"
    virtualenv_command: /usr/bin/python3 -m venv

- name: Confirm Flask is usable in the virtualenv
  ansible.builtin.command: "{{ seed_venv_python }} -c 'import flask; print(flask.__version__)'"
  register: common_flask_version
  changed_when: false

- name: Show the Flask version in use
  ansible.builtin.debug:
    msg: "Flask {{ common_flask_version.stdout | trim }} ({{ seed_venv_python }})"
