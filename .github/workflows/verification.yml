name: Verification

on:
  push:
    branches: [verification]
  workflow_dispatch:

env:
  ANSIBLE_STDOUT_CALLBACK: default
  ANSIBLE_RETRY_FILES_ENABLED: "0"
  ANSIBLE_FORCE_COLOR: "0"
  PY_COLORS: "0"

jobs:
  static:
    name: Syntaxe, zone DNS, applications
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Outils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bind9-utils > /dev/null
          pip install -q "ansible==9.*" flask
      - name: Contrôles statiques
        run: bash ci/static.sh

  sandbox:
    name: Sandbox 3 VM ${{ matrix.name }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 20.04
            image: geerlingguy/docker-ubuntu2004-ansible:latest
          - name: Ubuntu 22.04
            image: geerlingguy/docker-ubuntu2204-ansible:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ansible 9 + connexion docker (comme le runner CyberRangeCZ)
        run: |
          pip install -q "ansible==9.*" docker
          ansible-galaxy collection install community.docker > /dev/null
      - name: Démarrage des trois VM
        run: bash ci/net_up.sh "${{ matrix.image }}"
      - name: Provisioning (playbook.yml)
        run: bash ci/provision.sh provision.log
      - name: Vérifications d'intégration
        run: bash ci/check.sh
      - name: Diagnostic en cas d'échec
        if: failure()
        run: |
          for c in user attacker; do
            unit=$([ "$c" = user ] && echo iot || echo attacker-web)
            echo "::group::$c / $unit"
            docker exec "$c" systemctl status "$unit" --no-pager -l 2>&1 | head -30 || true
            docker exec "$c" journalctl -u "$unit" --no-pager -n 40 2>&1 | tail -40 || true
            echo "::endgroup::"
          done
